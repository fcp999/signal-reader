<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Signal · Your daily reader</title><link rel="stylesheet" href="static/style.css"></head><body>
<header><div><span class="eyebrow">YOUR PERSONAL NEWS DESK</span><h1>Signal<span> / reader</span></h1></div><div class="header-actions"><button id="preferences">Preferences / Sources</button><button id="update">↻ UPDATE</button></div></header>
<div class="statusbar"><span id="status" role="status">Connecting…</span><span>FOUR EDITIONS DAILY · UTC</span></div>
<dialog id="settings"><form method="dialog"><h2>Reader preferences</h2><p>Saved automatically in this browser.</p><div class="settings-grid">
<label>Theme<select id="theme"><option value="dark">Dark</option><option value="light">Light</option><option value="sepia">Sepia</option><option value="system">Match device</option></select></label>
<label>Text size<select id="textSize"><option value="small">Small</option><option value="medium">Medium</option><option value="large">Large</option><option value="xl">Extra large</option></select></label>
<label>Article font<select id="font"><option value="serif">Serif</option><option value="sans">Sans serif</option></select></label>
<label>Line spacing<select id="spacing"><option value="tight">Tight</option><option value="normal">Normal</option><option value="relaxed">Relaxed</option></select></label>
<label>Reading width<select id="width"><option value="narrow">Narrow</option><option value="normal">Normal</option><option value="wide">Wide</option></select></label>
<label>Story list<select id="density"><option value="comfortable">Comfortable</option><option value="compact">Compact</option></select></label>
<label><input id="images" type="checkbox"> Show article images</label>
<label><input id="autoRead" type="checkbox"> Mark read when opened</label>
</div><h3>News sources</h3><p>Choose the sources shown in this browser.</p><div id="sourceSettings" class="source-grid"></div><p id="enabledCount" role="status"></p><div class="actions"><button type="button" id="resetSettings">Reset defaults</button><button autofocus>Done</button></div></form></dialog><main><div class="filters"><input id="search" placeholder="Search your articles" aria-label="Search articles"><select id="source" aria-label="Source"><option value="">All enabled sources</option></select><label><input type="checkbox" id="unread"> Unread only</label></div><nav id="categories" aria-label="News category"></nav><div id="count" role="status"></div><div id="list"></div><button id="more" hidden>Load more</button></main><details><summary>Feed health & refresh details</summary><pre id="health"></pre></details><script src="static/preferences.js"></script><script src="static/app.js"></script></body></html>
